# GraalVM Native Image Configuration for Karandash CLI
# This file specifies build-time configuration for the native image compilation

# Build arguments
Args = --no-fallback \
       --enable-url-protocols=http,https \
       --enable-all-security-services \
       -H:+ReportExceptionStackTraces \
       -H:+AddAllCharsets \
       --initialize-at-build-time=org.slf4j \
       --initialize-at-build-time=kotlinx.serialization \
       --initialize-at-build-time=kotlin \
       --initialize-at-run-time=io.ktor.client.engine.okhttp.OkHttpEngine \
       --initialize-at-run-time=io.ktor.client.engine.cio.CIOEngine

# Resource includes
Args = -H:IncludeResources=.*/.*\.properties \
       -H:IncludeResources=.*/.*\.yaml \
       -H:IncludeResources=.*/.*\.yml \
       -H:IncludeResources=.*/.*\.json \
       -H:IncludeResources=.*/.*\.txt \
       -H:IncludeResources=META-INF/.*

# Reflection configuration
Args = -H:ReflectionConfigurationFiles=${.}/reflect-config.json

# Resource configuration
Args = -H:ResourceConfigurationFiles=${.}/resource-config.json

# Serialization configuration
Args = -H:SerializationConfigurationFiles=${.}/serialization-config.json

# JNI configuration (if native plugins are used)
Args = -H:JNIConfigurationFiles=${.}/jni-config.json
