name: Karandash MR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read          # Required for checking out the repository
      pull-requests: write    # Required for posting PR comments
      security-events: write  # Required for uploading SARIF results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for better diff analysis

      - name: Run Karandash validation
        uses: appKODE/karandash@v1.0.0
        with:
          sarif: 'true'
          comment: 'true'

# -----------------------------------------------------------------------------
# Usage Instructions
# -----------------------------------------------------------------------------
#
# This template uses the Karandash GitHub Action for the simplest setup.
# Copy this file to .github/workflows/karandash.yml in your repository.
#
# Configuration options:
#
#   version: 'v1.0.0'        # Pin to specific version (default: 'latest')
#   config-path: 'custom.yml' # Custom config location (default: auto-discover)
#   format: 'sarif'          # Output format: console, json, sarif (default: console)
#   sarif: 'true'            # Upload SARIF to Code Scanning (default: false)
#   comment: 'true'          # Post results as PR comment (default: false)
#   enrich: 'true'           # AI enrichment: generate title/description before validation (default: false)
#
# Example with custom configuration:
#
#   - name: Run Karandash validation
#     uses: appKODE/karandash@v1.0.0
#     with:
#       version: 'v1.2.0'
#       config-path: '.karandash/custom-rules.yml'
#       sarif: 'true'
#       comment: 'false'
#
