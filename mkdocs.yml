site_name: Karandash
site_description: The fastest, most extensible MR validation tool
site_author: Karandash Team
site_url: https://appkode.github.io/karandash/
repo_url: https://github.com/appKODE/karandash
repo_name: appKODE/karandash

strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Configuration:
    - YAML Config: configuration/YAML_CONFIG.md
    - Zero-Config: configuration/ZERO_CONFIG.md
    - Config Inheritance: features/config-inheritance.md
    - Profiles: features/profiles.md
    - Scripts: configuration/scripts.md
    - Dangerfile: configuration/dangerfile.md
  - Rules:
    - Overview: rules/index.md
    - Title & Description:
      - Title Format: rules/title-format.md
      - Description Format: rules/description-format.md
      - Commit Messages: rules/commit-messages.md
      - Commit Body: rules/commit-body.md
      - JIRA Ticket: rules/jira-ticket.md
    - Branch & Labels:
      - Branch Naming: rules/branch-naming.md
      - Labels: rules/labels.md
      - Context Tags: rules/context-tags.md
    - Files & Changes:
      - File Changes: rules/file-changes.md
      - Size Limits: rules/size-limits.md
