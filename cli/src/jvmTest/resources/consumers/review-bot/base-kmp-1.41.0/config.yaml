# Base config for KMP (Kotlin Multiplatform) projects.
# Adds platform tag requirement [android|ios] and narrows android AI scope to android/**

extends:                                                                                                                                                                                                                                                                                        
  file-resolution: fallback-remote                   
  url: "../../base/.karandash/config.yaml"     

patterns:
  project-tag: "@bracketed((?:android|ios))"
  project-title: "@optional(@project-tickets)@project-tag .+"

rules:
  title-format:
    pattern: "@project-title"
    suggestion: "Format: '[${KARANDASH_JIRA_KEY}-123][android] Title' or '[ios] Title'. Examples: '[${KARANDASH_JIRA_KEY}-42][android] Add login screen', '[ios] Fix OTP timer'. Length: 10–120 chars."
    explanation: "Platform tag routes the MR to the correct reviewers and enables per-platform metrics."

  commit-messages:
    pattern: "@project-title"
    suggestion: "Format: '[${KARANDASH_JIRA_KEY}-123][android] Description' or '[ios] Description'. Examples: '[${KARANDASH_JIRA_KEY}-42][android] Implement login UI', '[ios] Stop timer on background'. Max 72 chars."
    explanation: "Platform-tagged commits enable per-platform release notes and route issues to the right team."

  context-tag:
    allowed: [android, ios]
    delimiter: brackets
    exactlyOne: true
    caseSensitive: true
    checkMrTitle: true
    checkCommitTitles: true
    suggestion: "Add exactly one tag: [android] for Android, or [ios] for iOS. Place it after the optional task ID in both MR title and each commit."
    explanation: "Context tags route MRs to platform-specific reviewers and feed per-platform metrics dashboards."

# KMP: CHANGELOG required only for Android changes with a JIRA ticket (iOS exempt)
# Policies use array REPLACE — must include all needed policies from base.
policies:
  - name: changelog-requirement
    when: 'title_matches("@any-ticket") && has_tag(android)'
    override:
      commit-body:
        explanation: "CHANGELOG lines for Android changes enable per-platform release notes generation."
ai:
  scopes:
    android:
      paths: ["android/**"]
    ios:
      paths: ["ios/**/*.{swift,m,mm,h}"]
      instructions: { file: "scopes/ios-instructions.md" }
      best-practices: { file: "scopes/ios-best-practices.md" }
    shared:
      paths: ["shared/**/*.kt"]
      instructions: { file: "scopes/shared-instructions.md" }
      best-practices: { file: "scopes/shared-best-practices.md" }

