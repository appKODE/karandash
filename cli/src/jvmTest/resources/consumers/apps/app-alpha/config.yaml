# Synthetic sample consumer: a KMP app (Android + iOS).
# Extends base-kmp. All rules and AI config inherited from base via base-kmp.
# Secrets (KARANDASH_GITLAB_TOKEN, BIFROST_API_KEY, BIFROST_BASE_URL, KARANDASH_BASE_TOKEN) must be set in CI/CD.
extends:
  file-resolution: fallback-remote
  url: "https://gitlab.example.com/api/v4/projects/1234/repository/files/base-kmp%2F.karandash%2Fconfig.yaml/raw?ref=1.41.0"
  auth:
    type: custom-header
    name: "PRIVATE-TOKEN"
    value: "${KARANDASH_GITLAB_TOKEN}"

env:
  KARANDASH_JIRA_KEY: "ALPHA"

cache:
  dir: "cache/karandash"
