kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
org.gradle.java.installations.idea-jdks-directory=.gradle/idea-jdks

# Disable default hierarchy template to avoid metadata compilation issues
# with platform-specific code in nativeMain (OpenSSL cinterop, dlopen, etc.)
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.mpp.enableCInteropCommonization=true

# Limit parallel Kotlin/Native compiler invocations to prevent OOM during linking
# in memory-constrained CI environments (Docker). Each native link task can consume
# 1-2 GB; without this limit, parallel linking of test binaries causes SIGBUS (exit 135).
kotlin.native.maxParallelCompilations=2

# Dokka V2 mode (required for Dokka 2.0+)
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Maven Central publishing (build-logic karandash.publishing, com.vanniktech.maven.publish).
# Credentials and signing come from the environment, never from this file:
#   ORG_GRADLE_PROJECT_mavenCentralUsername / ORG_GRADLE_PROJECT_mavenCentralPassword
#   ORG_GRADLE_PROJECT_signingInMemoryKey / ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
# Without a signing key, publishToMavenLocal still works (unsigned).
pomDescription=Karandash: configurable merge request and pull request validation
pomUrl=https://github.com/appKODE/karandash
pomScmUrl=https://github.com/appKODE/karandash
pomScmConnection=scm:git:https://github.com/appKODE/karandash.git
pomScmDevConnection=scm:git:ssh://github.com/appKODE/karandash.git
pomLicenseName=MIT License
pomLicenseUrl=https://opensource.org/licenses/MIT
pomLicenseDist=repo
pomDeveloperId=appKODE
pomDeveloperName=KODE

# atomicfu: JVM transformation via the compiler plugin. The legacy bytecode transformer
# (atomicfu 0.33+) needs a classpath config that is only registered when
# `atomicfu.dependenciesVersion` is non-null, which our modules set to null.
kotlinx.atomicfu.enableJvmIrTransformation=true

# A pull-through Maven mirror fetches an uncached artifact from upstream before answering, which can take
# longer than Gradle's 30 s read timeout; one timeout disables the repository for the whole build.
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=5
