name: Setup build
description: JDK 17, Gradle, the Kotlin/Native distribution cache and, on Linux, the native build libraries.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: zulu
        java-version: '17'
    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
    # libcurl (Ktor curl engine), libssl (plugin signatures), clang + lld (wasm32 example builds)
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends libcurl4-openssl-dev libssl-dev clang lld
    # The image ships ~30 GB of SDKs this build never uses; without removing them a K/N build fills the 15 GB left free
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        df -h / | tail -1
    # Private-repo runners have 2 CPUs and 7.7 GB: one K/N compilation at a time, plus 6 GB extra swap so a
    # release link's peak pages out instead of the kernel killing the runner
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p ~/.gradle && echo 'kotlin.native.maxParallelCompilations=1' >> ~/.gradle/gradle.properties
        sudo fallocate -l 6G /swapfile-ci && sudo chmod 600 /swapfile-ci && sudo mkswap -q /swapfile-ci && sudo swapon /swapfile-ci
        free -h
