# Wallet mobile banking app (KMP: Android + iOS).
# Extends base-kmp. All rules and AI config inherited from base via base-kmp.
# Secrets (GITLAB_TOKEN, BIFROST_API_KEY, BIFROST_BASE_URL, KARANDASH_BASE_TOKEN) must be set in CI/CD.
#
# Production extends (in wallet-mobile repo's .karandash/config.yaml):
#   extends:
#     url: "https://gitlab.example.com/api/v4/projects/<BASE_PROJECT_ID>/repository/files/.karandash-kmp%2Fconfig.yaml/raw?ref=main"
#     auth:
#       type: bearer-token
#       token: "${KARANDASH_BASE_TOKEN}"

extends: "../../base-kmp/.karandash/config.yaml"

env:
  KARANDASH_JIRA_KEY: "WAL"
  KARANDASH_AI_MAX_TOKENS: "30000"
