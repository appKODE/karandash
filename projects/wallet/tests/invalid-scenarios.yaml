scenarios:
  - name: "Invalid: wrong JIRA key (TEL instead of WAL)"
    mr:
      title: "[TEL-123][android] Add feature"
      commits:
        - subject: "[TEL-123][android] Implement feature"
          body: "CHANGELOG: [TEL-123] Add feature."
    expect: fail
    expected-rules: ["jira-ticket"]

  - name: "Invalid: Cyrillic in MR title"
    mr:
      title: "[android] Добавить экран карты"
    expect: fail
    expected-rules: ["language-policy"]

  - name: "Invalid: missing platform tag"
    mr:
      title: "[WAL-123] Add payment feature"
    expect: fail
    expected-rules: ["title-format", "context-tag"]

  - name: "Invalid: WAL android + JIRA but missing CHANGELOG"
    mr:
      title: "[WAL-123][android] Add payment screen"
      commits:
        - subject: "[WAL-123][android] Implement payment UI"
          body: ""
    expect: fail
    expected-rules: ["commit-body"]

  - name: "Invalid: CHANGELOG missing task ID"
    mr:
      title: "[WAL-123][android] Add payment screen"
      commits:
        - subject: "[WAL-123][android] Implement payment UI"
          body: "CHANGELOG: Add payment screen."
    expect: fail
    expected-rules: ["commit-body"]

  - name: "Invalid: capitalised [Android] tag"
    mr:
      title: "[Android] Fix crash on login"
    expect: fail
    expected-rules: ["title-format"]  # context-tag is case-insensitive since base-kmp 1.45.0

  - name: "Invalid: commit task not in MR title"
    mr:
      title: "[WAL-100][android] Implement feature A"
      commits:
        - subject: "[WAL-999][android] Unrelated change"
    expect: fail
    expected-rules: ["cross-entity-consistency"]

  - name: "Invalid: draft MR"
    mr:
      title: "Draft: [ios] Implement new onboarding"
      draft: true
    expect: fail
    expected-rules: ["draft-prevention"]

  - name: "Invalid: Cyrillic in branch name"
    mr:
      title: "[android] Fix auth issue"
      commits:
        - subject: "[android] Fix token refresh"
      branch: "fix/исправить-токен"
    expect: fail
    expected-rules: ["language-policy"]

  - name: "Invalid: both android and ios tags"
    mr:
      title: "[android] [ios] Fix shared crash"
    expect: fail
    expected-rules: ["context-tag"]

  - name: "Invalid: CHANGELOG references task not in MR title"
    mr:
      title: "[WAL-100][android] Add feature"
      commits:
        - subject: "[WAL-100][android] Implement feature"
          body: "CHANGELOG: [WAL-100] Add feature, [WAL-999] Fix unrelated issue."
    expect: fail
    expected-rules: ["cross-entity-consistency"]
