scenarios:
  - name: "Invalid: wrong JIRA key (TEL instead of LDG)"
    mr:
      title: "[TEL-123] Add feature"
      commits:
        - subject: "[TEL-123] Implement feature"
          body: "CHANGELOG: [TEL-123] Add feature."
    expect: fail
    expected-rules: ["jira-ticket"]

  - name: "Invalid: Cyrillic in MR title"
    mr:
      title: "Добавить функцию поиска"
    expect: fail
    expected-rules: ["language-policy"]

  - name: "Invalid: LDG JIRA present but missing CHANGELOG"
    mr:
      title: "[LDG-123] Add shelf management"
      commits:
        - subject: "[LDG-123] Implement shelf reorder"
          body: ""
    expect: fail
    expected-rules: ["commit-body"]

  - name: "Invalid: CHANGELOG missing task ID"
    mr:
      title: "[LDG-123] Add shelf management"
      commits:
        - subject: "[LDG-123] Implement shelf reorder"
          body: "CHANGELOG: Add shelf management."
    expect: fail
    expected-rules: ["commit-body"]

  - name: "Invalid: draft MR"
    mr:
      title: "Draft: Fix book download"
      draft: true
    expect: fail
    expected-rules: ["draft-prevention"]

  - name: "Invalid: Cyrillic in commit title"
    mr:
      title: "Fix search result ordering"
      commits:
        - subject: "Исправить порядок результатов поиска"
    expect: fail
    expected-rules: ["language-policy"]

  - name: "Invalid: Cyrillic in branch name"
    mr:
      title: "Fix reader crash"
      commits:
        - subject: "Fix null page crash in reader"
      branch: "fix/исправить-ридер"
    expect: fail
    expected-rules: ["language-policy"]

  - name: "Invalid: commit task not in MR title"
    mr:
      title: "[LDG-100] Implement feature"
      commits:
        - subject: "[LDG-999] Unrelated change"
    expect: fail
    expected-rules: ["cross-entity-consistency"]

  - name: "Invalid: title too short"
    mr:
      title: "Fix bug"
    expect: fail
    expected-rules: ["title-format"]

  - name: "Invalid: CHANGELOG references task not in MR title"
    mr:
      title: "[LDG-100] Add feature"
      commits:
        - subject: "[LDG-100] Implement feature"
          body: "CHANGELOG: [LDG-100] Add feature, [LDG-999] Fix unrelated issue."
    expect: fail
    expected-rules: ["cross-entity-consistency"]
